<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090b"><title>Gaming Arena | Ederstone</title><link rel="icon" href="assets/icons/favicon-32.png"><link rel="stylesheet" href="site-ui.css"><style>
:root{--bg:#07090b;--panel:#0c1115;--line:#26323a;--text:#f4f7f8;--muted:#8d9aa3;--cyan:#65e7ff;--red:#b83b61;--gold:#ffd34d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}#game{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none}.hud{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}.top{display:flex;justify-content:space-between;gap:10px;padding:12px}.panel{background:#07090bdd;border:1px solid #65e7ff33;border-radius:14px;box-shadow:0 10px 35px #0008;backdrop-filter:blur(12px)}.stats{padding:10px 12px}.title{font:800 12px/1 Space Grotesk,Inter,sans-serif;letter-spacing:.14em;color:var(--cyan)}.sub{font-size:9px;color:var(--muted);margin-top:5px}.metrics{display:flex;gap:12px;margin-top:9px}.metric b{display:block;font-size:13px}.metric span{font-size:7px;color:var(--muted);letter-spacing:.1em}.inspect{padding:10px 12px;text-align:right;font-size:9px;color:var(--muted)}.inspect strong{display:block;color:#fff;font-size:11px;margin-bottom:4px}.bottom{display:flex;justify-content:center;padding:12px}.toolbar{display:flex;gap:5px;padding:7px;max-width:calc(100vw - 20px);overflow:auto;pointer-events:auto}.tool{border:1px solid #fff1;background:#0c1115;color:#b8c2c8;border-radius:10px;padding:9px 10px;min-width:62px;cursor:pointer;font:700 8px Inter,sans-serif}.tool.active,.tool:hover{border-color:var(--cyan);background:#12232a;color:#fff}.tool small{display:block;font-size:7px;color:#6f7c84;margin-top:3px}.help{position:fixed;z-index:6;left:12px;bottom:82px;padding:8px 10px;color:#7e8a91;font-size:8px;pointer-events:none}.help b{color:#c9d2d7}.notice{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 17px;border:1px solid #65e7ff66;background:#05090bf2;border-radius:14px;box-shadow:0 15px 50px #0008;font-size:10px;opacity:0;pointer-events:none;transition:.2s}.notice.show{opacity:1}@media(max-width:650px){.inspect{max-width:145px}.tool{min-width:55px;padding:8px 7px}.help{display:none}}
.arena-nav{position:fixed;top:12px;left:12px;z-index:10000;display:flex;gap:6px;pointer-events:auto}.arena-nav a{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid rgba(101,231,255,.28);border-radius:999px;background:rgba(7,9,11,.86);color:#f4f7f8;text-decoration:none;font:800 9px Inter,system-ui,sans-serif;letter-spacing:.08em;box-shadow:0 10px 35px rgba(0,0,0,.35);backdrop-filter:blur(12px)}.arena-nav a:hover{border-color:#65e7ff;color:#65e7ff}@media(max-width:650px){.arena-nav{top:8px;left:8px}.arena-nav a{padding:8px 10px;font-size:8px}}</style></head><body><div class="arena-nav"><a href="index.html" aria-label="Return to Ederstone homepage">⌂ HOME</a></div><canvas id="game"></canvas><div class="hud"><div class="top"><div class="panel stats"><div class="title">EDERSTONE // GAMING ARENA</div><div class="sub">FACTORY PROTOCOL · BUILD · EXTRACT · REFINE</div><div class="metrics"><div class="metric"><b id="fps">0</b><span>RENDER FPS</span></div><div class="metric"><b id="tps">0</b><span>WORKER TPS</span></div><div class="metric"><b id="entities">0</b><span>ENTITIES</span></div></div></div><div class="panel inspect" id="inspect"><strong>BUILD MODE</strong>Click a tile to place a building. R rotates.</div></div><div class="bottom"><div class="panel toolbar"><button class="tool active" data-tool="select">⌖ SELECT<small>Inspect</small></button><button class="tool" data-tool="belt">→ BELT<small>R rotate</small></button><button class="tool" data-tool="miner">⛏ MINER<small>Ore node</small></button><button class="tool" data-tool="smelter">▣ SMELTER<small>Refine</small></button><button class="tool" data-tool="chest">□ CHEST<small>Store</small></button><button class="tool" data-tool="erase">× ERASE<small>Remove</small></button></div></div></div><div class="help panel">Drag to pan · Wheel/pinch to zoom · <b>R</b> rotate · <b>Esc</b> select</div><div id="notice" class="notice"></div>
<script>
const C=document.getElementById('game'),X=C.getContext('2d'),N=100,CELL=40,D=[[0,-1],[1,0],[0,1],[-1,0]],DN=['NORTH','EAST','SOUTH','WEST'];let W,H,dpr=1,scale=1,cx=0,cy=0,tool='select',dir=1,drag=false,lx=0,ly=0,downX=0,downY=0,frames=0,fpsTime=performance.now(),last=performance.now(),grid=new Int8Array(N*N),ore=new Int8Array(N*N),rot=new Int8Array(N*N),inv=new Int16Array(N*N*2),items=new Float32Array(),tps=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*dpr;C.height=H*dpr;C.style.width=W+'px';C.style.height=H+'px';X.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function toast(s){let n=document.getElementById('notice');n.textContent=s;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),1100)}
const wc=`
const N=100,T={E:0,B:1,M:2,S:3,C:4},D=[[0,-1],[1,0],[0,1],[-1,0]];const grid=new Int8Array(N*N),ore=new Int8Array(N*N),rot=new Int8Array(N*N),inv=new Int16Array(N*N*2),items=[];let ticks=0,last=performance.now();
const id=(x,y)=>y*N+x,inside=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
function seed(){for(let y=7;y<93;y++)for(let x=7;x<93;x++)if(Math.random()<.022)ore[id(x,y)]=Math.random()<.55?1:2}
function send(){postMessage({type:'state',grid:grid.slice(),ore:ore.slice(),rot:rot.slice(),inv:inv.slice(),items:Float32Array.from(items.flatMap(a=>[a.x,a.y,a.type])).buffer})}
function place(x,y,t,r){if(!inside(x,y)||grid[id(x,y)]!==0)return;if(t===T.M&&!ore[id(x,y)])return;grid[id(x,y)]=t;rot[id(x,y)]=r}
function step(){ticks++;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=id(x,y),g=grid[i];if(g===T.M&&ore[i]&&ticks%45===0){let r=rot[i],nx=x+D[r][0],ny=y+D[r][1];if(inside(nx,ny)&&grid[id(nx,ny)]===T.B)items.push({x:nx+.5-D[r][0]*.1,y:ny+.5-D[r][1]*.1,type:ore[i],p:0});else inv[i*2+ore[i]-1]++}if(g===T.S&&ticks%75===0){if(inv[i*2]){inv[i*2]--;inv[i*2+1]++}else if(inv[i*2+1]){inv[i*2+1]--;inv[i*2+1]++}}}
for(let k=items.length-1;k>=0;k--){let a=items[k],tx=Math.floor(a.x),ty=Math.floor(a.y);if(!inside(tx,ty)){items.splice(k,1);continue}let i=id(tx,ty),g=grid[i];if(g!==T.B){items.splice(k,1);continue}let r=rot[i];a.p+=.055;if(a.p>=1){a.p=0;let nx=tx+D[r][0],ny=ty+D[r][1];if(!inside(nx,ny)){items.splice(k,1);continue}let ng=grid[id(nx,ny)];if(ng===T.B){a.x=nx+.5;a.y=ny+.5}else if(ng===T.S||ng===T.C){inv[id(nx,ny)*2+a.type-1]++;items.splice(k,1)}}}
if(performance.now()-last>=1000){postMessage({type:'metrics',tps:ticks,entities:items.length+grid.reduce((a,v)=>a+(v?1:0),0)});ticks=0;last=performance.now()}if(Math.random()<.055)send()}
onmessage=e=>{let m=e.data;if(m.type==='start'){seed();send();setInterval(step,1000/60)}if(m.type==='place')place(m.x,m.y,m.t,m.r);if(m.type==='erase'&&inside(m.x,m.y))grid[id(m.x,m.y)]=0;if(m.type==='request')send()}`;
const w=new Worker(URL.createObjectURL(new Blob([wc],{type:'application/javascript'})));w.onmessage=e=>{let m=e.data;if(m.type==='state'){grid=new Int8Array(m.grid);ore=new Int8Array(m.ore);rot=new Int8Array(m.rot);inv=new Int16Array(m.inv);items=new Float32Array(m.items)}if(m.type==='metrics'){tps=m.tps;document.getElementById('tps').textContent=tps;document.getElementById('entities').textContent=m.entities}};w.postMessage({type:'start'});
function tile(sx,sy){return{x:Math.floor((sx-cx)/(CELL*scale)),y:Math.floor((sy-cy)/(CELL*scale))}}function scr(x,y){return{x:cx+x*CELL*scale,y:cy+y*CELL*scale}}
function building(x,y,i,p){let s=CELL*scale,px=p.x,py=p.y,m=s*.5;if(grid[i]===1){X.fillStyle='#17252b';X.fillRect(px+2,py+2,s-4,s-4);X.save();X.translate(px+m,py+m);X.rotate(rot[i]*Math.PI/2);X.fillStyle='#65e7ff';X.beginPath();X.moveTo(s*.28,0);X.lineTo(-s*.12,-s*.14);X.lineTo(-s*.12,s*.14);X.fill();X.restore()}else if(grid[i]===2){X.fillStyle='#765c2e';X.fillRect(px+s*.15,py+s*.17,s*.7,s*.66);X.fillStyle='#e6c36b';X.beginPath();X.arc(px+m,py+m,s*.18,0,7);X.fill()}else if(grid[i]===3){X.fillStyle='#54323d';X.fillRect(px+s*.1,py+s*.1,s*.8,s*.8);X.fillStyle='#b83b61';X.fillRect(px+s*.27,py+s*.27,s*.46,s*.46);X.fillStyle='#ffd34d';X.fillRect(px+m-s*.08,py+m-s*.08,s*.16,s*.16)}else if(grid[i]===4){X.fillStyle='#24444d';X.fillRect(px+s*.14,py+s*.25,s*.72,s*.5);X.strokeStyle='#65e7ff';X.strokeRect(px+s*.14,py+s*.25,s*.72,s*.5)}}
function draw(){let now=performance.now();frames++;if(now-fpsTime>=1000){document.getElementById('fps').textContent=frames;frames=0;fpsTime=now}X.clearRect(0,0,W,H);X.fillStyle='#07090b';X.fillRect(0,0,W,H);let sx=Math.max(0,Math.floor(-cx/(CELL*scale))-1),sy=Math.max(0,Math.floor(-cy/(CELL*scale))-1),ex=Math.min(N,Math.ceil((W-cx)/(CELL*scale))+1),ey=Math.min(N,Math.ceil((H-cy)/(CELL*scale))+1);for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){let p=scr(x,y),i=y*N+x,s=CELL*scale;X.fillStyle=(x+y)%2?'#0a0e11':'#0b1013';X.fillRect(p.x,p.y,s,s);X.strokeStyle='#65e7ff0d';X.strokeRect(p.x,p.y,s,s);if(ore[i]){X.fillStyle=ore[i]===1?'#b9c0c4':'#d27a45';X.beginPath();X.arc(p.x+s/2,p.y+s/2,s*.22,0,7);X.fill()}if(grid[i])building(x,y,i,p)}for(let k=0;k<items.length;k+=3){let p=scr(items[k],items[k+1]);X.fillStyle=items[k+2]===1?'#e5e8ea':'#e58a4d';X.beginPath();X.arc(p.x,p.y,Math.max(3,4*scale),0,7);X.fill()}requestAnimationFrame(draw)}draw();cx=W/2-N*CELL*scale/2;cy=H/2-N*CELL*scale/2;
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(q=>q.classList.toggle('active',q===b));toast(tool.toUpperCase()+' SELECTED')});addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){dir=(dir+1)%4;toast('DIRECTION: '+DN[dir])}if(e.key==='Escape'){tool='select';document.querySelector('[data-tool="select"]').classList.add('active')}});
C.addEventListener('pointerdown',e=>{drag=true;lx=downX=e.clientX;ly=downY=e.clientY;C.setPointerCapture(e.pointerId)});C.addEventListener('pointermove',e=>{if(drag){cx+=e.clientX-lx;cy+=e.clientY-ly;lx=e.clientX;ly=e.clientY}});C.addEventListener('pointerup',e=>{drag=false;if(Math.hypot(e.clientX-downX,e.clientY-downY)>8)return;let q=tile(e.clientX,e.clientY);if(q.x<0||q.y<0||q.x>=N||q.y>=N)return;let i=q.y*N+q.x;if(tool==='select'){let n=['EMPTY','BELT','MINER','SMELTER','CHEST'][grid[i]];document.getElementById('inspect').innerHTML='<strong>'+n+'</strong>'+(ore[i]?'ORE · '+(ore[i]===1?'IRON':'COPPER')+' · ':'')+'DIR · '+DN[rot[i]]}else if(tool==='erase'){w.postMessage({type:'erase',x:q.x,y:q.y});toast('REMOVED')}else{let m={belt:1,miner:2,smelter:3,chest:4};w.postMessage({type:'place',x:q.x,y:q.y,t:m[tool],r:dir});toast('PLACED · '+tool.toUpperCase())}});
C.addEventListener('wheel',e=>{e.preventDefault();let before=tile(e.clientX,e.clientY),f=e.deltaY<0?1.12:.89;scale=Math.max(.35,Math.min(2.4,scale*f));let after=tile(e.clientX,e.clientY);cx+=(after.x-before.x)*CELL*scale;cy+=(after.y-before.y)*CELL*scale},{passive:false});
</script><script src="site-ui.js"></script></body></html>
