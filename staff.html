<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Staff Management | EderStone</title><link rel="stylesheet" href="auth.css">
<style>
.staff-wrap{width:min(1100px,92vw);margin:auto}.staff-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.staff-card{background:rgba(12,13,18,.88);border:1px solid rgba(255,82,111,.2);border-radius:18px;padding:20px}.staff-grid{display:grid;grid-template-columns:320px 1fr;gap:18px}.field{margin:12px 0}.field label{display:block;margin-bottom:7px;font-size:.7rem;color:#9ca4b7}.field input,.field select{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#08090d;color:#fff}.staff-btn{width:100%;margin-top:8px}.status{min-height:22px;font-size:.72rem}.table-wrap{overflow:auto}.staff-table{width:100%;border-collapse:collapse}.staff-table th,.staff-table td{padding:12px 9px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);font-size:.75rem;white-space:nowrap}.role-select{padding:7px;background:#08090d;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:7px}.toggle{padding:7px 10px;border-radius:8px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.15)}.muted{color:#747d90;font-size:.7rem}@media(max-width:760px){.staff-grid{grid-template-columns:1fr}.staff-head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main class="auth-screen"><div class="auth-noise"></div><div class="staff-wrap">
<div class="staff-head"><div><p class="auth-kicker">EDERSTONE · OWNER CONTROL</p><h1>Staff <em>management.</em></h1><p class="muted">Create accounts, assign roles, and revoke access.</p></div><a class="owner-back" href="/owner">← Owner tools</a></div>
<div class="staff-grid"><section class="staff-card"><h2>Add staff</h2><form id="staff-form"><div class="field"><label>DISPLAY NAME</label><input id="name" required autocomplete="name"></div><div class="field"><label>USERNAME</label><input id="username" required autocomplete="username"></div><div class="field"><label>TEMPORARY PASSWORD</label><input id="password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>ROLE</label><select id="role"><option>manager</option><option>cashier</option><option>kitchen</option><option>waiter</option><option>delivery</option><option>viewer</option></select></div><button class="staff-btn" type="submit">CREATE ACCOUNT</button><p id="status" class="status" role="status"></p></form></section>
<section class="staff-card"><h2>Accounts</h2><p class="muted">Deactivating an account also removes its active sessions.</p><div class="table-wrap"><table class="staff-table"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr></thead><tbody id="staff-list"></tbody></table></div></section></div></div></main>
<script src="staff.js" defer></script></body></html>
