<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Loading | Ederstone</title>
<link rel="stylesheet" href="access-loader.css">
</head>
<body>
<main class="loader-screen">
  <div class="loader-orbit orbit-one"></div>
  <div class="loader-orbit orbit-two"></div>
  <section class="loader-core" aria-live="polite">
    <div class="loader-mark"><span>ES</span></div>
    <p class="loader-kicker">EDERSTONE / PRIVATE PORTFOLIO</p>
    <div class="loader-ring"><span></span><b>ACCESS GRANTED</b></div>
    <div class="loader-feed" id="loader-feed" aria-label="Loading progress"></div>
    <div class="loader-progress"><span></span></div>
    <h1 id="welcome">Preparing your private workspace.</h1>
    <p class="loader-note">Starting secure portfolio handoff…</p>
  </section>
</main>
<script src="access-loader.js"></script>
</body>
</html>
