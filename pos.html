<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#080808"><meta name="description" content="Ederstone Restaurant POS"><link rel="manifest" href="/manifest.webmanifest"><meta name="application-name" content="EderStone"><meta name="mobile-web-app-capable" content="yes"><title>Ederstone Restaurant POS</title><link rel="stylesheet" href="pos.css"></head>
<body class="pos-loading">
<div id="posLaunch" class="pos-launcher" aria-hidden="true"><div class="launch-core"><div class="launch-mark"><img src="assets/icons/web-app-manifest-512x512.png" alt="EderStone logo"></div><strong>OPENING EDERSTONE POS</strong><small>Preparing restaurant workspace...</small></div></div>
<div id="posOpening" class="pos-opening" aria-live="polite">
  <div class="opening-orbit"><div class="opening-logo"><img src="assets/icons/web-app-manifest-512x512.png" alt="EderStone logo"></div></div>
  <div class="opening-brand">EDERSTONE</div>
  <strong>Opening Restaurant POS...</strong>
  <div class="opening-progress" aria-hidden="true"><i></i></div>
  <small>Secure local register • Offline-ready</small>
  <footer>© 2026 EderStone. All rights reserved.</footer>
</div>
<div class="pos-shell">
<header class="pos-header"><a class="pos-brand" href="projects.html"><span>ES</span> EDERSTONE <small>RESTAURANT POS</small></a><div class="pos-status"><span class="dot"></span><b id="clock">--:--</b><span>OFFLINE-READY</span></div><div class="header-actions"><button class="icon-btn" id="fullscreenPos" title="Full screen">⛶ <span>Full screen</span></button><button class="icon-btn" id="logoutPos" title="Exit POS">⏻ <span>Exit</span></button></div></header>
<div class="sync-pill" id="syncStatus" role="status" aria-live="polite" title="Synchronization status"><span class="sync-dot"></span><span class="sync-label">Checking sync…</span><button class="sync-action" id="syncNow" type="button" aria-label="Sync now" title="Sync now">↻</button></div><div class="pos-layout">
<aside class="sidebar" id="sidebar"><button class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">‹<span>Collapse</span></button>
<button class="nav active" data-view="dashboard">▦ <span>Dashboard</span></button>
<button class="nav" data-view="tables" data-permission="pos.read">▥ <span>Tables</span></button>
<button class="nav" data-action="new-order" data-permission="orders.create">＋ <span>New Order</span></button>
<button class="nav" data-view="orders" data-permission="pos.read">☷ <span>Sales History</span></button>
<button class="nav" data-view="menu" data-permission="menu.manage">◫ <span>Menu</span></button>
<button class="nav" data-view="kitchen" data-permission="kitchen.manage">♨ <span>Kitchen</span></button>
<button class="nav" data-view="unfinished">⏳ <span>Unfinished Tasks</span><b class="nav-count" id="unfinishedCount">0</b></button>
<button class="nav" data-view="inventory" data-permission="inventory.manage">▤ <span>Inventory</span></button>
<button class="nav" data-view="staff" data-permission="staff.read">♙ <span>Staff</span></button>
<button class="nav" data-view="reports" data-permission="reports.read">◒ <span>Sales</span></button>
<button class="nav" data-view="settings" data-permission="pos.write">⚙ <span>Settings</span></button>
</aside>
<main id="app"></main>
</div></div>
<div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script src="app-core.js"></script><script src="app-state.js"></script><script src="app-data.js"></script><script src="pos-data.js"></script><script src="pos-sync.js"></script><script src="qrcode.js"></script><script src="auth-permissions.js"></script>
<script src="auth-session.js"></script><script>
document.addEventListener('DOMContentLoaded',()=>{
  const map={
    inventory:['inventory.manage'],
    menu:['menu.manage'],
    kitchen:['kitchen.manage'],
    delivery:['delivery.read'],
    reports:['reports.read'],
    staff:['staff.read']
  };
  Object.entries(map).forEach(([key,perms])=>{
    document.querySelectorAll('[data-section="'+key+'"], [data-nav="'+key+'"], #'+key).forEach(el=>{
      const ok=perms.every(p=>window.EderStonePermissions?.can?.(window.EderStonePOSPermissions?.role?.(),p));
      if(!ok){el.hidden=true;el.setAttribute('aria-hidden','true');}
    });
  });
});
</script><script>
document.addEventListener('ederstone:sync-status',e=>{
 const el=document.getElementById('syncStatus'); if(!el)return;
 const d=e.detail||{};
 let label=d.syncing?'Syncing…':!d.online?'Offline':(d.lastError||'').toLowerCase().includes('conflict')?'Conflict':'Synced';
 el.classList.toggle('is-offline',!d.online);
 el.classList.toggle('is-syncing',!!d.syncing);
 el.classList.toggle('is-conflict',label==='Conflict');
 const text=el.querySelector('.sync-label');
 if(text)text.textContent=label+(d.queueSize?' · '+d.queueSize+' queued':'');
});
</script><script>
document.addEventListener('click',e=>{
 const b=e.target.closest('#syncNow'); if(!b)return;
 if(!window.EderStonePOSSync)return;
 b.disabled=true;
 Promise.resolve(window.EderStonePOSSync.pull()).then(()=>window.EderStonePOSSync.push()).finally(()=>{b.disabled=false});
});
</script><script src="pos.js"></script></body></html>
