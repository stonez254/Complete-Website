<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#05070b"><title>Neon Escape | Ederstone Gaming Arena</title><link rel="icon" href="assets/icons/favicon-32.png"><link rel="stylesheet" href="site-ui.css"><style>
:root{--cyan:#65e7ff;--red:#b83b61;--gold:#ffd34d;--bg:#03050a}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff}.top{display:flex;justify-content:space-between;padding:14px;gap:10px}.panel{background:#05070bd9;border:1px solid #65e7ff35;border-radius:14px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(12px)}.stats{padding:10px 13px;min-width:180px}.brand{font:900 10px/1 Inter;letter-spacing:.16em;color:var(--cyan)}.row{display:flex;gap:15px;margin-top:9px}.metric b{display:block;font-size:16px}.metric span{display:block;font-size:7px;letter-spacing:.1em;color:#84929b}.boost{padding:10px 13px;align-self:flex-start;color:var(--gold);font:900 9px/1 Inter;letter-spacing:.13em;opacity:0;transform:translateY(-5px);transition:.2s}.boost.show{opacity:1;transform:none}.controls{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:clamp(8px,2vw,16px);width:min(100% - 20px,430px);padding:0;pointer-events:none}.cluster{display:flex;gap:clamp(7px,1.8vw,12px);pointer-events:auto}.ctrl{width:clamp(54px,14vw,68px);height:clamp(50px,13vw,60px);border:1px solid #65e7ff45;border-radius:18px;background:#071017b8;color:#eafcff;box-shadow:0 10px 30px #0008;backdrop-filter:blur(10px);font:900 10px Inter;touch-action:none;user-select:none}.ctrl:active{transform:scale(.94);background:#12313a}.pause{position:absolute;right:16px;top:92px;width:46px;height:42px}.menu{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:#020408bb;backdrop-filter:blur(9px);color:#fff}.menu.open{display:grid}.card{width:min(360px,calc(100vw - 32px));padding:28px;border:1px solid #65e7ff55;border-radius:24px;background:#070b11f2;box-shadow:0 30px 100px #000}.card h1{margin:0 0 8px;font:900 34px/1 "Space Grotesk",Inter}.card p{color:#87949d;font-size:12px}.menu-btn{width:100%;margin-top:10px;padding:13px;border:1px solid #65e7ff44;border-radius:12px;background:#0b151b;color:#fff;font:800 10px Inter;letter-spacing:.1em}.menu-btn.primary{background:var(--cyan);color:#031015}.arena-link{display:block;text-align:center;margin-top:14px;color:#7e929b;font-size:9px;text-decoration:none}@media(max-width:600px){.top{padding:9px}.stats{min-width:0}.row{gap:9px}.controls{width:min(100% - 16px,390px);gap:7px}.cluster{gap:7px}.ctrl{width:clamp(50px,14vw,60px);height:clamp(48px,13vw,56px);font-size:9px}.pause{top:75px;right:10px}.boost{font-size:8px}}
</style></head><body><canvas id="scene"></canvas>
<div class="hud"><div class="top"><div class="panel stats"><div class="brand">EDERSTONE // CHASE PROTOCOL</div><div class="row"><div class="metric"><b id="score">0</b><span>DISTANCE</span></div><div class="metric"><b id="speed">100</b><span>KM/H</span></div><div class="metric"><b id="high">0</b><span>HIGH SCORE</span></div></div></div><div id="boost" class="panel boost">SPEED BOOST</div></div><button class="ctrl pause" id="pauseBtn" aria-label="Pause">Ⅱ</button><div class="controls"><div class="cluster"><button class="ctrl" data-act="left">←<br>LEFT</button><button class="ctrl" data-act="right">→<br>RIGHT</button></div><div class="cluster"><button class="ctrl" data-act="jump">↑<br>JUMP</button><button class="ctrl" data-act="duck">↓<br>DUCK</button></div></div></div>
<div class="menu" id="menu"><div class="card"><h1 id="menuTitle">PAUSED</h1><p id="menuText">The corridor is frozen. Choose your next move.</p><button class="menu-btn primary" id="resume">RESUME</button><button class="menu-btn" id="restart">RESTART</button><a class="arena-link" href="gaming.html">← Back to Gaming Arena</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const canvas=document.getElementById('scene'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x03050a);scene.fog=new THREE.FogExp2(0x071018,.018);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,300);camera.position.set(0,4.2,8.5);camera.lookAt(0,1,-15);
const hemi=new THREE.HemisphereLight(0x8beaff,0x09030b,1.5);scene.add(hemi);const sun=new THREE.DirectionalLight(0xd9f8ff,2.8);sun.position.set(4,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const cyan=new THREE.MeshStandardMaterial({color:0x10252d,emissive:0x00bfe8,emissiveIntensity:2,metalness:.65,roughness:.28}),red=new THREE.MeshStandardMaterial({color:0x35101c,emissive:0xa9003f,emissiveIntensity:2,metalness:.5,roughness:.35}),dark=new THREE.MeshStandardMaterial({color:0x080b10,metalness:.8,roughness:.22}),glow=new THREE.MeshBasicMaterial({color:0x65e7ff});
function box(w,h,d,m){const x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=true;x.receiveShadow=true;return x}
const world=new THREE.Group();scene.add(world);
const floorMat=new THREE.MeshStandardMaterial({color:0x080e13,metalness:.7,roughness:.3});const floor=box(18,.4,260,floorMat);floor.position.set(0,-.45,-105);floor.receiveShadow=true;world.add(floor);
for(let x of [-3.3,0,3.3]){const lane=new THREE.Mesh(new THREE.BoxGeometry(.08,.03,260),glow);lane.position.set(x,-.23,-105);world.add(lane)}
for(let x of [-9,9]){const wall=box(.35,5,260,dark);wall.position.set(x,2,-105);world.add(wall)}
const segments=[];const SEG=12,COUNT=24;
function makeSegment(i){const g=new THREE.Group();g.position.z=-i*SEG-10;for(let s=0;s<4;s++){const z=-s*3;const light=box(.12,.12,1.5,glow);light.position.set(s%2?-6.7:6.7,2.2,z);g.add(light)}if(i>2&&Math.random()<.6)spawnObstacle(g);world.add(g);segments.push(g)}
function spawnObstacle(g){const lane=(Math.floor(Math.random()*3)-1)*3.3,type=Math.floor(Math.random()*3);let o;if(type===0){o=box(2.25,.9,.65,red);o.position.set(lane,.35,0);o.userData.kind='jump'}else if(type===1){o=box(2.5,.65,.8,red);o.position.set(lane,2.45,0);o.userData.kind='duck'}else{o=box(2.5,3.2,.8,red);o.position.set(lane,1.15,0);o.userData.kind='block'}o.castShadow=true;g.add(o)}
for(let i=0;i<COUNT;i++)makeSegment(i);
function runnerMesh(){const g=new THREE.Group();const torso=box(.72,1.25,.45,cyan);torso.position.y=1.45;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,12),glow);head.position.y=2.28;g.add(head);const armL=box(.18,.9,.18,cyan),armR=armL.clone();armL.position.set(-.52,1.48,0);armR.position.set(.52,1.48,0);g.add(armL,armR);const legL=box(.2,1,.22,red),legR=legL.clone();legL.position.set(-.22,.55,0);legR.position.set(.22,.55,0);g.add(legL,legR);g.userData={armL,armR,legL,legR,torso};return g}
const player=runnerMesh();player.position.set(0,0,2);scene.add(player);
function chaserMesh(){const g=new THREE.Group();const body=box(2.1,3.2,1.3,dark);body.position.y=1.7;g.add(body);const head=box(1.65,1.25,1.25,dark);head.position.y=3.8;g.add(head);const eyeMat=new THREE.MeshBasicMaterial({color:0xff174f});for(let x of [-.38,.38]){const e=new THREE.Mesh(new THREE.SphereGeometry(.13,10,10),eyeMat);e.position.set(x,3.85,.66);g.add(e)}return g}const chaser=chaserMesh();chaser.scale.setScalar(.62);chaser.position.set(0,0,7.8);scene.add(chaser);
const particles=new THREE.Group();scene.add(particles);for(let i=0;i<90;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.035,5,5),new THREE.MeshBasicMaterial({color:i%2?0x65e7ff:0xb83b61}));p.position.set((Math.random()-.5)*12,Math.random()*5-1,-Math.random()*180);p.userData.v=.5+Math.random()*1.5;particles.add(p)}
let lane=0,targetLane=0,y=0,vy=0,duck=0,speed=24,distance=0,high=Number(localStorage.getItem('ederstone-neon-high')||0),running=true,paused=false,last=performance.now(),boostTimer=0,spawnSeed=0;
document.getElementById('high').textContent=Math.floor(high);
function act(a){if(!running||paused)return;if(a==='left')targetLane=Math.max(-1,targetLane-1);if(a==='right')targetLane=Math.min(1,targetLane+1);if(a==='jump'&&y<.05){vy=9.2;duck=0}if(a==='duck'&&y<.1)duck=.65}
function reset(){targetLane=lane=0;y=vy=duck=0;speed=24;distance=0;running=true;paused=false;chaser.position.z=7;segments.forEach((g,i)=>{g.position.z=-i*SEG-10;g.children.forEach(o=>{if(o.userData.kind)o.visible=true})});document.getElementById('menu').classList.remove('open');document.getElementById('menuTitle').textContent='PAUSED';last=performance.now()}
function crash(){running=false;document.getElementById('menuTitle').textContent='CAUGHT';document.getElementById('menuText').textContent='The chaser closed the gap. Your run is over.';document.getElementById('resume').style.display='none';document.getElementById('menu').classList.add('open');if(distance>high){high=Math.floor(distance);localStorage.setItem('ederstone-neon-high',high);document.getElementById('high').textContent=high}}
function hit(o){if(!o.visible||!o.userData.kind)return false;const px=targetLane*3.3;const dz=Math.abs(o.parent.position.z+o.position.z-player.position.z);if(Math.abs(px-o.position.x)<1.25&&dz<1.15){if(o.userData.kind==='jump'&&y>.8){o.visible=false;return false}if(o.userData.kind==='duck'&&duck>.35){o.visible=false;return false}return true}return false}
function update(dt){if(!running||paused)return;speed+=dt*.42;const milestone=Math.floor(distance/500);const desired=24*Math.pow(1.15,milestone);if(speed<desired)speed+=dt*7;distance+=speed*dt*.12;targetLane=Math.max(-1,Math.min(1,targetLane));player.position.x+=(targetLane*3.3-player.position.x)*Math.min(1,dt*10);y+=vy*dt;vy-=24*dt;if(y<0){y=0;vy=0}duck=Math.max(0,duck-dt);player.position.y=y;player.scale.y=duck>0?.55:1;player.rotation.z+=(targetLane*-.08-player.rotation.z)*dt*8;const t=performance.now()*.001*(speed/24);const u=player.userData;u.armL.rotation.x=Math.sin(t*10)*.75;u.armR.rotation.x=-Math.sin(t*10)*.75;u.legL.rotation.x=-Math.sin(t*10)*.8;u.legR.rotation.x=Math.sin(t*10)*.8;u.torso.scale.y=1+Math.sin(t*20)*.025;
for(const g of segments){g.position.z+=speed*dt;if(g.position.z>12){g.position.z-=COUNT*SEG;g.children.forEach(o=>{if(o.userData.kind){o.visible=Math.random()>.28}})}for(const o of g.children)if(hit(o))crash()}
chaser.position.x+=(player.position.x-chaser.position.x)*dt*3;chaser.position.z+=(6.2-chaser.position.z)*dt*.8;chaser.rotation.y=Math.sin(t)*.03;
for(const p of particles.children){p.position.z+=speed*dt*p.userData.v*.25;if(p.position.z>8)p.position.z=-190}
if(Math.floor(distance)%500<speed*dt*.12){boostTimer=.8;speed+=2.5}boostTimer=Math.max(0,boostTimer-dt);document.getElementById('boost').classList.toggle('show',boostTimer>0);document.getElementById('score').textContent=Math.floor(distance);document.getElementById('speed').textContent=Math.floor(speed*3.6);if(chaser.position.z<3.1)crash()}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);camera.position.x+=(player.position.x*.28-camera.position.x)*dt*3;camera.position.y+=(4.2+(y*.18)-camera.position.y)*dt*3;camera.lookAt(player.position.x*.2,1.25+y*.2,-16);renderer.render(scene,camera)}requestAnimationFrame(loop);
document.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();act(a)},{passive:false})});addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')act('left');else if(k==='arrowright'||k==='d')act('right');else if(k==='arrowup'||k==='w'||k===' ')act('jump');else if(k==='arrowdown'||k==='s')act('duck');else if(k==='p'||k==='escape')togglePause()});
function togglePause(){if(!running)return;paused=!paused;document.getElementById('menu').classList.toggle('open',paused);document.getElementById('menuTitle').textContent='PAUSED';document.getElementById('menuText').textContent='The corridor is frozen. Choose your next move.';document.getElementById('resume').style.display='block'}document.getElementById('pauseBtn').onclick=togglePause;document.getElementById('resume').onclick=()=>{paused=false;document.getElementById('menu').classList.remove('open');last=performance.now()};document.getElementById('restart').onclick=reset;
</script><script src="site-ui.js"></script></body></html>
