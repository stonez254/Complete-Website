<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05020d">
<title>Neon Escape | Ederstone Gaming Arena</title>
<link rel="icon" href="assets/icons/favicon-32.png">
<link rel="stylesheet" href="site-ui.css">
<style>
:root{--cyan:#63f3ff;--pink:#ff3b91;--violet:#8b5cff;--gold:#ffe45c;--bg:#05020d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;inset:0;z-index:10;pointer-events:none;color:#fff}
.top{display:flex;justify-content:space-between;align-items:flex-start;padding:14px;gap:10px}
.panel{background:rgba(5,4,16,.78);border:1px solid rgba(99,243,255,.28);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.45);backdrop-filter:blur(12px)}
.stats{padding:10px 13px;min-width:235px}
.brand{font:900 10px/1 Inter,sans-serif;letter-spacing:.16em;color:var(--cyan)}
.row{display:flex;gap:16px;margin-top:9px}
.metric b{display:block;font-size:16px}
.metric span{display:block;font-size:7px;letter-spacing:.1em;color:#8e9aaa}
.bars{display:flex;gap:8px;margin-top:9px}
.bar{width:72px;height:5px;border-radius:99px;background:#151326;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left;border-radius:inherit}
#energy{background:linear-gradient(90deg,var(--cyan),var(--violet))}
#shield{background:linear-gradient(90deg,var(--gold),#ff8d4d)}
.boost{padding:10px 13px;align-self:flex-start;color:var(--gold);font:900 9px/1 Inter;letter-spacing:.13em;opacity:0;transform:translateY(-5px);transition:.2s}
.boost.show{opacity:1;transform:none}
.mult{margin-top:7px;font:900 10px Inter;color:var(--pink);letter-spacing:.08em}
.controls{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:clamp(7px,2vw,14px);width:min(100% - 16px,430px);pointer-events:none}
.cluster{display:flex;gap:clamp(6px,1.7vw,10px);pointer-events:auto}
.ctrl{width:clamp(50px,14vw,64px);height:clamp(48px,13vw,58px);border:1px solid rgba(99,243,255,.35);border-radius:17px;background:rgba(7,12,24,.74);color:#effcff;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(10px);font:900 9px Inter;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
.ctrl:active{transform:scale(.93);background:rgba(22,56,70,.9)}
.pause{position:absolute;right:16px;top:92px;width:46px;height:42px}
.tip{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);font:700 7px Inter;color:#70808e;letter-spacing:.08em;white-space:nowrap}
.menu{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(2,1,8,.76);backdrop-filter:blur(10px);color:#fff}
.menu.open{display:grid}
.card{width:min(390px,calc(100vw - 28px));padding:28px;border:1px solid rgba(99,243,255,.35);border-radius:24px;background:rgba(7,5,18,.95);box-shadow:0 30px 100px #000}
.card h1{margin:0 0 8px;font:900 34px/1 Inter}
.card p{color:#929cab;font-size:12px;line-height:1.55}
.menu-btn{width:100%;margin-top:10px;padding:13px;border:1px solid rgba(99,243,255,.3);border-radius:12px;background:#0b1320;color:#fff;font:800 10px Inter;letter-spacing:.1em}
.menu-btn.primary{background:var(--cyan);color:#031015}
.arena-link{display:block;text-align:center;margin-top:14px;color:#82919d;font-size:9px;text-decoration:none}
@media(max-width:600px){
.top{padding:9px}.stats{min-width:0}.row{gap:9px}.metric b{font-size:14px}.bar{width:55px}
.controls{width:min(100% - 12px,390px);gap:6px}.cluster{gap:6px}.ctrl{width:clamp(48px,14vw,58px);height:clamp(46px,13vw,54px);font-size:8px}
.pause{top:74px;right:9px}.boost{font-size:8px}.tip{display:none}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="top">
    <div class="panel stats">
      <div class="brand">EDERSTONE // NEON ESCAPE</div>
      <div class="row">
        <div class="metric"><b id="score">0</b><span>DISTANCE</span></div>
        <div class="metric"><b id="speed">100</b><span>KM/H</span></div>
        <div class="metric"><b id="high">0</b><span>HIGH SCORE</span></div>
      </div>
      <div class="bars">
        <div><div class="bar"><i id="energy"></i></div><span style="font-size:6px;color:#73808d">ENERGY</span></div>
        <div><div class="bar"><i id="shield"></i></div><span style="font-size:6px;color:#73808d">SHIELD</span></div>
      </div>
      <div class="mult" id="mult">×1 MULTIPLIER</div>
    </div>
    <div id="boost" class="panel boost">SPEED BOOST</div>
  </div>
  <button class="ctrl pause" id="pauseBtn" aria-label="Pause">Ⅱ</button>
  <div class="controls">
    <div class="cluster">
      <button class="ctrl" data-act="left">←<br>LEFT</button>
      <button class="ctrl" data-act="right">→<br>RIGHT</button>
    </div>
    <div class="cluster">
      <button class="ctrl" data-act="jump">↑<br>JUMP</button>
      <button class="ctrl" data-act="duck">↓<br>DUCK</button>
    </div>
  </div>
  <div class="tip">A/D OR ←/→ · W/SPACE OR ↑ · S OR ↓ · P/ESC PAUSE</div>
</div>

<div class="menu" id="menu">
  <div class="card">
    <h1 id="menuTitle">PAUSED</h1>
    <p id="menuText">The neon corridor is frozen. Choose your next move.</p>
    <button class="menu-btn primary" id="resume">RESUME</button>
    <button class="menu-btn" id="restart">RESTART</button>
    <a class="arena-link" href="gaming.html">← Back to Gaming Arena</a>
  </div>
</div>

<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize,{passive:true});resize();

const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const state={
 running:false,paused:false,over:false,last:performance.now(),time:0,distance:0,speed:29,targetSpeed:29,
 lane:0,targetLane:0,x:0,y:0,vy:0,duck:0,energy:100,shield:100,mult:1,
 high:Number(localStorage.getItem('ederstone-neon-high-2d')||0),boost:0,shake:0,flash:0,
 spawn:0,spawnEvery:.95,obstacles:[],particles:[],sparks:[],stars:[],buildings:[],
 trail:[]
};

for(let i=0;i<95;i++)state.stars.push({x:Math.random(),y:Math.random()*.72,z:rand(.1,1),tw:rand(0,TAU)});
for(let i=0;i<36;i++)state.buildings.push({side:Math.random()<.5?-1:1,x:rand(.02,.42),w:rand(.025,.09),h:rand(.08,.34),layer:Math.random()});
document.getElementById('high').textContent=Math.floor(state.high);

function roadY(){return H*.17}
function roadBottom(){return H}
function horizon(){return roadY()}
function laneX(lane){return W*.5+lane*W*.145}
function playerBase(){return H*.78}
function roadScale(y){return clamp((y-horizon())/(H-horizon()),0,1)}
function projectZ(z){const p=1-Math.min(1,z/105);return horizon()+Math.pow(p,1.65)*(H-horizon())}
function roadWidth(y){const p=roadScale(y);return W*(.12+.88*p)}
function emit(x,y,count,color,speed=1){for(let i=0;i<count;i++){const a=rand(0,TAU),s=rand(35,170)*speed;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.7),max:.7,size:rand(1.5,5),color})}}
function obstacle(kind,lane,z=105){state.obstacles.push({kind,lane,z,hit:false,phase:rand(0,TAU)})}
function reset(){
 Object.assign(state,{running:true,paused:false,over:false,last:performance.now(),time:0,distance:0,speed:29,targetSpeed:29,lane:0,targetLane:0,x:0,y:0,vy:0,duck:0,energy:100,shield:100,mult:1,boost:0,shake:0,flash:0,spawn:0,spawnEvery:.95});
 state.obstacles.length=0;state.particles.length=0;state.sparks.length=0;state.trail.length=0;
 document.getElementById('menu').classList.remove('open');document.getElementById('resume').style.display='block';
}
function start(){reset();state.x=laneX(0)}
function gameOver(){
 if(state.over)return;state.over=true;state.running=false;state.shake=.55;emit(state.x,playerBase(),55,'#ff3b91',1.8);
 if(state.distance>state.high){state.high=Math.floor(state.distance);localStorage.setItem('ederstone-neon-high-2d',state.high);document.getElementById('high').textContent=state.high}
 document.getElementById('menuTitle').textContent='NEON ESCAPE // CAUGHT';
 document.getElementById('menuText').textContent='The chaser closed the gap. Final distance: '+Math.floor(state.distance)+'m.';
 document.getElementById('resume').style.display='none';document.getElementById('menu').classList.add('open');
}
function act(a){
 if(!state.running||state.paused)return;
 if(a==='left')state.targetLane=clamp(state.targetLane-1,-1,1);
 if(a==='right')state.targetLane=clamp(state.targetLane+1,-1,1);
 if(a==='jump'&&state.y<=.02){state.vy=10.6;state.duck=0;emit(state.x,playerBase()+8,10,'#63f3ff',.7)}
 if(a==='duck'&&state.y<=.05)state.duck=.7;
}
function togglePause(){
 if(state.over)return;
 state.paused=!state.paused;document.getElementById('menu').classList.toggle('open',state.paused);
 document.getElementById('menuTitle').textContent='PAUSED';document.getElementById('menuText').textContent='The neon corridor is frozen. Choose your next move.';
 document.getElementById('resume').style.display='block';state.last=performance.now();
}
function hitTest(o){
 const oy=projectZ(o.z),px=laneX(state.targetLane),py=playerBase()-state.y*25;
 const close=Math.abs(oy-py)<42;
 if(!close||Math.abs(px-laneX(o.lane))>W*.09)return false;
 if(o.kind==='low'&&state.y>.65)return false;
 if(o.kind==='high'&&state.duck>.25)return false;
 return true;
}
function spawnPattern(){
 const r=Math.random(),l=Math.floor(rand(-1,2));
 if(r<.45)obstacle('low',l);
 else if(r<.72)obstacle('high',l);
 else if(r<.9)obstacle('block',l);
 else {const safe=Math.floor(rand(-1,2));[-1,0,1].filter(x=>x!==safe).forEach(x=>obstacle(Math.random()<.5?'low':'block',x));}
 state.spawnEvery=clamp(.92-state.distance/18000,.38,.92)*rand(.78,1.18);
}
function update(dt){
 if(!state.running||state.paused)return;
 state.time+=dt;
 state.targetSpeed=29*Math.pow(1.15,Math.floor(state.distance/500));
 state.speed+=(state.targetSpeed-state.speed)*Math.min(1,dt*3.5);
 state.distance+=state.speed*dt*.95;
 state.mult=1+Math.floor(state.distance/250);
 state.energy=clamp(state.energy-dt*(.65+state.speed*.004),0,100);
 if(state.energy<=0)gameOver();
 state.targetLane=clamp(state.targetLane,-1,1);
 const tx=laneX(state.targetLane);state.x+=(tx-state.x)*Math.min(1,dt*12);
 state.vy-=25*dt;state.y+=state.vy*dt;if(state.y<0){state.y=0;state.vy=0}
 state.duck=Math.max(0,state.duck-dt);
 state.spawn+=dt;if(state.spawn>state.spawnEvery){state.spawn=0;spawnPattern()}
 for(const o of state.obstacles){
   o.z-=state.speed*dt;
   if(!o.hit&&o.z<4&&o.z>-5){if(hitTest(o)){o.hit=true;state.shield-=o.kind==='block'?35:24;state.shake=.28;state.flash=.18;emit(state.x,playerBase()-state.y*25,28,'#ff3b91',1.1);if(state.shield<=0){gameOver()}else{o.z=-10}}}
 }
 state.obstacles=state.obstacles.filter(o=>o.z>-10);
 if(Math.floor(state.distance/500)>Math.floor((state.distance-state.speed*dt*.95)/500)){state.boost=.9;state.speed+=5;emit(state.x,playerBase()-40,20,'#ffe45c',1.5)}
 state.boost=Math.max(0,state.boost-dt);state.shake=Math.max(0,state.shake-dt);state.flash=Math.max(0,state.flash-dt);
 const stride=Math.sin(state.time*(state.speed/4));
 for(let i=0;i<2;i++)state.trail.push({x:state.x+rand(-8,8),y:playerBase()-state.y*25+rand(25,55),life:.28});
 for(const p of state.trail)p.life-=dt;state.trail=state.trail.filter(p=>p.life>0);
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=45*dt;p.life-=dt}
 state.particles=state.particles.filter(p=>p.life>0);
 for(const p of state.sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}state.sparks=state.sparks.filter(p=>p.life>0);
 document.getElementById('score').textContent=Math.floor(state.distance);
 document.getElementById('speed').textContent=Math.floor(state.speed*3.6);
 document.getElementById('energy').style.transform='scaleX('+state.energy/100+')';
 document.getElementById('shield').style.transform='scaleX('+state.shield/100+')';
 document.getElementById('mult').textContent='×'+state.mult+' MULTIPLIER';
 document.getElementById('boost').classList.toggle('show',state.boost>0);
}
function glowLine(x1,y1,x2,y2,color,width=2){
 ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor=color;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05020f');g.addColorStop(.5,'#101035');g.addColorStop(1,'#02040b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const hg=ctx.createRadialGradient(W*.5,horizon(),0,W*.5,horizon(),W*.55);hg.addColorStop(0,'rgba(0,229,255,.2)');hg.addColorStop(.55,'rgba(120,45,255,.08)');hg.addColorStop(1,'transparent');ctx.fillStyle=hg;ctx.fillRect(0,0,W,H);
 for(const s of state.stars){const x=(s.x*W+state.time*18*s.z)%W,y=s.y*H;ctx.globalAlpha=.25+.45*s.z;ctx.fillStyle=s.z>.65?'#63f3ff':'#fff';ctx.fillRect(x,y,1+s.z*1.5,1+s.z*1.5)}ctx.globalAlpha=1;
 // parallax skyline layer 1
 for(const b of state.buildings){const x=b.side<0?b.x*W:W-b.x*W-b.w*W,y=horizon()+18-b.h*H*.5;ctx.fillStyle=b.layer>.5?'#0a1230':'#120c29';ctx.fillRect(x,y,b.w*W,b.h*H);for(let wy=y+8;wy<y+b.h*H;wy+=13)if(Math.random()<.35)ctx.fillStyle='#63f3ff22',ctx.fillRect(x+4,wy,3,2)}
 // distant city
 ctx.fillStyle='#080a1d';ctx.beginPath();ctx.moveTo(0,horizon()+25);for(let x=0;x<=W;x+=25)ctx.lineTo(x,horizon()+rand(5,38));ctx.lineTo(W,H*.45);ctx.lineTo(0,H*.45);ctx.fill();
 // road
 const top=horizon(),left=W*.5-W*.12,right=W*.5+W*.12;
 const rg=ctx.createLinearGradient(0,top,0,H);rg.addColorStop(0,'#090a1b');rg.addColorStop(1,'#03040b');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(right,top);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
 for(let i=0;i<3;i++){const lx=W*.5+(i-1)*W*.145;glowLine(lx,top,lx+(lx-W*.5)*7,H,'#63f3ff',1)}
 // speed streaks = depth layer
 for(let i=0;i<22;i++){const p=(i/22+state.time*.22)%1;const y=top+p*p*(H-top);const x=W*.5+Math.sin(i*12.7)*roadWidth(y)*.45;ctx.globalAlpha=p*.35;glowLine(x,y,x,y+4+p*34,i%2?'#ff3b91':'#63f3ff',1)}ctx.globalAlpha=1;
}
function drawObstacle(o){
 const y=projectZ(o.z),scale=.25+roadScale(y)*.95,x=laneX(o.lane),w=(o.kind==='block'?45:60)*scale;
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 if(o.kind==='low'){ctx.shadowColor='#ff3b91';ctx.shadowBlur=22;ctx.fillStyle='#4c0b2d';ctx.fillRect(-38,-18,76,36);glowLine(-38,-18,38,-18,'#ff3b91',4);glowLine(-38,18,38,18,'#ff3b91',3)}
 else if(o.kind==='high'){ctx.shadowColor='#ffe45c';ctx.shadowBlur=22;ctx.fillStyle='#3a2608';ctx.fillRect(-42,-62,84,18);glowLine(-42,-62,42,-62,'#ffe45c',4);glowLine(-38,-62,-38,0,'#ffe45c',3);glowLine(38,-62,38,0,'#ffe45c',3)}
 else{ctx.shadowColor='#8b5cff';ctx.shadowBlur=25;ctx.fillStyle='#190d3f';ctx.fillRect(-35,-62,70,62);glowLine(-35,-62,35,-62,'#8b5cff',4);glowLine(-35,0,35,0,'#ff3b91',3);ctx.fillStyle='#63f3ff';ctx.fillRect(-4,-46,8,24)}
 ctx.restore();
}
function drawPlayer(){
 const base=playerBase()-state.y*25,duck=state.duck>0;
 const sx=duck?1.25:1,sy=duck?.58:1+Math.sin(state.time*18)*.025,lean=(laneX(state.targetLane)-state.x)*.018;
 ctx.save();ctx.translate(state.x,base);ctx.rotate(clamp(lean,-.12,.12));ctx.scale(sx,sy);
 for(const p of state.trail){ctx.globalAlpha=p.life/.28*.35;ctx.fillStyle='#63f3ff';ctx.fillRect(p.x-state.x-3,p.y-base-2,6,4)}ctx.globalAlpha=1;
 ctx.shadowColor='#63f3ff';ctx.shadowBlur=28;ctx.fillStyle='#0c3140';ctx.fillRect(-18,-64,36,48);
 ctx.shadowColor='#ff3b91';ctx.fillStyle='#ff3b91';ctx.fillRect(-15,-16,10,30);ctx.fillRect(5,-16,10,30);
 ctx.shadowColor='#63f3ff';ctx.fillStyle='#63f3ff';ctx.beginPath();ctx.arc(0,-75,13,0,TAU);ctx.fill();
 ctx.fillStyle='#fff';ctx.fillRect(-6,-78,12,4);
 const stride=Math.sin(state.time*(state.speed/3.2))*.65;ctx.strokeStyle='#63f3ff';ctx.lineWidth=7;ctx.lineCap='round';
 ctx.beginPath();ctx.moveTo(-14,-20);ctx.lineTo(-20+stride*12,5);ctx.stroke();ctx.beginPath();ctx.moveTo(14,-20);ctx.lineTo(20-stride*12,5);ctx.stroke();
 ctx.restore();
}
function drawChaser(){
 const gap=1-Math.min(1,state.distance/1600),x=state.x,base=H*.86+gap*H*.03;
 ctx.save();ctx.translate(x,base);ctx.scale(1.05,1.05);ctx.shadowColor='#ff174f';ctx.shadowBlur=35;ctx.fillStyle='#090611';ctx.fillRect(-48,-105,96,105);ctx.fillStyle='#1d0a19';ctx.fillRect(-35,-145,70,40);ctx.fillStyle='#ff174f';ctx.fillRect(-20,-130,10,5);ctx.fillRect(10,-130,10,5);ctx.strokeStyle='#ff174f';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-38,-30);ctx.lineTo(-65,20);ctx.moveTo(38,-30);ctx.lineTo(65,20);ctx.stroke();ctx.restore();
}
function draw(){
 const sx=state.shake?rand(-1,1)*state.shake*14:0,sy=state.shake?rand(-1,1)*state.shake*9:0;ctx.save();ctx.translate(sx,sy);
 drawBackground();
 for(const o of state.obstacles)if(o.z<105)drawObstacle(o);
 for(const p of state.particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill()}ctx.globalAlpha=1;
 drawChaser();drawPlayer();ctx.restore();
 if(state.flash){ctx.fillStyle='rgba(255,59,145,'+(state.flash*2)+')';ctx.fillRect(0,0,W,H)}
}
function loop(now){const dt=Math.min(.035,(now-state.last)/1000);state.last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

document.querySelectorAll('[data-act]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.act)},{passive:false})});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown','a','d','w','s',' ','p','escape'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')act('left');else if(k==='arrowright'||k==='d')act('right');else if(k==='arrowup'||k==='w'||k===' ')act('jump');else if(k==='arrowdown'||k==='s')act('duck');else if(k==='p'||k==='escape')togglePause()});
document.getElementById('pauseBtn').onclick=togglePause;
document.getElementById('resume').onclick=()=>{state.paused=false;document.getElementById('menu').classList.remove('open');state.last=performance.now()};
document.getElementById('restart').onclick=reset;
start();
</script>
<script src="site-ui.js"></script>
</body>
</html>
